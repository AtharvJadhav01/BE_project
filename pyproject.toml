[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-human-state-capture"
version = "0.1.0"
description = "A desktop application that captures and synchronizes voice, keyboard, and facial data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OpenCode Assistant"}
]
keywords = ["multimodal", "human-state", "capture", "audio", "keyboard", "facial", "synchronization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# Dependencies - will be installed from requirements.txt
dependencies = []

[project.urls]
Homepage = "https://github.com/example/multimodal-human-state-capture"
Documentation = "https://github.com/example/multimodal-human-state-capture#readme"

[project.scripts]
multimodal-capture = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "tests*",
    "docs*",
    "config*",
    "data*",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true