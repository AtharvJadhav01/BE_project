# Configuration for Multimodal Human State Capture Application
# This file contains default settings that can be overridden at runtime

audio:
  enabled: true
  sample_rate: 16000
  channels: 1
  format: "wav"
  chunk_duration_ms: 10000
  device: null  # Use default device if null

keyboard:
  enabled: true
  capture_modifiers: true
  capture_context: true
  exclude_sensitive: true

camera:
  enabled: true
  fps: 15
  resolution: [640, 480]
  device: 0  # Camera index

face:
  enabled: true
  detection_model: "mediapipe"
  landmark_model: "mediapipe"
  refine_landmarks: true  # Includes iris tracking
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

storage:
  output_directory: "data/sessions"
  audio_chunk_duration_ms: 10000
  flush_interval_ms: 5000
  max_file_size_mb: 100

logging:
  level: "INFO"
  format: "json"
  file: "logs/app.log"
  max_size_mb: 10
  backup_count: 5

ui:
  theme: "default"
  update_interval_ms: 100
  show_system_tray: true

analysis:
  enabled: true

  # Temporal window settings
  temporal_window_sec: 3.0
  update_interval_ms: 500

  # Baseline settings
  baseline_warmup_sec: 10.0
  baseline_min_samples: 50
  ema_alpha: 0.1
  min_std: 1e-6

  # Face analysis
  face:
    enabled: true
    emotion_enabled: true
    emotion_confidence_threshold: 0.5
    emotion_smoothing_window: 5
    emotion_smoothing_alpha: 0.3
    window_size_sec: 2.0
    update_interval_ms: 200
    baseline_frames: 150
    expression_threshold: 0.3
    confidence_threshold: 0.5

  # Audio analysis
  audio:
    enabled: true
    window_size_sec: 1.0
    hop_size_sec: 0.1
    baseline_duration_sec: 10.0
    pitch_min_hz: 80
    pitch_max_hz: 400
    pitch_threshold_semitones: 2.0
    energy_threshold_db: -40
    voice_activity_threshold: 0.01

  # Keyboard analysis
  keyboard:
    enabled: true
    window_size_sec: 5.0
    baseline_events: 100
    correction_threshold_ms: 2000
    pause_threshold_sec: 2.0

  # Multimodal fusion
  fusion:
    enabled: true
    window_size_sec: 3.0
    update_interval_ms: 500
    min_modalities: 2
    confidence_threshold: 0.6
    uncertainty_threshold: 0.4
    modality_weights:
      face: 1.0
      audio: 1.0
      keyboard: 1.0
    min_modalities_for_fusion: 2
    confidence_threshold: 0.6
    uncertainty_threshold: 0.4
    face_freshness_sec: 1.0
    audio_freshness_sec: 1.0
    keyboard_freshness_sec: 5.0
    face_stale_sec: 3.0
    audio_stale_sec: 3.0
    keyboard_stale_sec: 15.0
    smoothing_alpha: 0.3
    min_persistence_frames: 3
    debounce_sec: 2.0
    debounce_sec: 2.0

  # Storage for analysis results
  storage:
    analysis_enabled: true
    flush_interval_ms: 5000